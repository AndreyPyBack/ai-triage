<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: .25rem 0 1rem; }
    #status { min-height: 1.5em; }
    .error { color: #a12622; }
    .success { color: #176b38; }
    button:disabled { opacity: .65; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" required></textarea>
    <button id="submit" type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="answer" hidden aria-labelledby="answer-title">
    <h2 id="answer-title">Результат разбора</h2>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <p><strong>Черновик ответа:</strong></p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const input = document.querySelector("#message");
    const submit = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function clearAnswer() {
      answer.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearAnswer();
      status.className = "";
      if (!input.value.trim()) {
        status.textContent = "Введите текст заявки, чтобы начать разбор.";
        status.className = "error";
        input.focus();
        return;
      }

      submit.disabled = true;
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input.value }),
        });
        const data = await reply.json();
        if (reply.ok && data.status === "ready") {
          topic.textContent = data.topic;
          draft.textContent = data.draft;
          answer.hidden = false;
          status.textContent = "Черновик готов. Проверьте его перед отправкой клиенту.";
          status.className = "success";
        } else if (data.status === "manual_review") {
          status.textContent = "AI не смог разобрать заявку. Проверьте её вручную и подготовьте ответ самостоятельно.";
          status.className = "error";
        } else {
          status.textContent = "Не удалось разобрать заявку. Проверьте текст и попробуйте ещё раз.";
          status.className = "error";
        }
      } catch {
        status.textContent = "Сервис временно недоступен. Разберите заявку вручную и подготовьте ответ самостоятельно.";
        status.className = "error";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
